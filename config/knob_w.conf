CONFIG_ZMK_KEYBOARD_NAME="KNOB-W"
CONFIG_BT_DEVICE_NAME="KNOB-W"
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Prefer broadly compatible 15-30 ms intervals; the host chooses the final values.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_GATT_AUTO_SEC_REQ=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Interactive knob input should not request skipped connection events.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# Use conservative radio preparation; a missed event must not reboot the keyboard.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_XTAL_ADVANCED=n
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
# Do not assume the ProMicro module has a precision external 32 kHz crystal.
# Keep the clock source that passed physical BLE pairing on this board.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
# Nested behavior/event dispatch and Zephyr 4 Bluetooth need more than the legacy defaults.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=6144
CONFIG_THREAD_NAME=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_ASSERT=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_ZMK_SLEEP=n
CONFIG_POWEROFF=y
CONFIG_ZMK_IDLE_TIMEOUT=1800000
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_MAX_CONN=3
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=1
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_ZMK_DISPLAY=n
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_JSON_LIBRARY=y
