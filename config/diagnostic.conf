CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_BT_SMP_LOG_LEVEL_DBG=y
CONFIG_BT_CONN_LOG_LEVEL_DBG=y
CONFIG_BT_L2CAP_LOG_LEVEL_INF=y
CONFIG_BT_ATT_LOG_LEVEL_DBG=y
CONFIG_BT_LOG_SNIFFER_INFO=n
CONFIG_LOG_DEFAULT_LEVEL=2
# Diagnostic A/B test only: eliminate LFRC drift/calibration from radio timing.
# Synthesized LFCLK keeps HFCLK running and is not a battery-optimized release.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
CONFIG_INIT_STACKS=y
